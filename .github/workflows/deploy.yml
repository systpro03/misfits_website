name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    # 1. Setup Node 24 environment to compile Tailwind
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # 2. Install your Tailwind dependencies
    - name: Install dependencies
      run: npm install

    # 3. Fix execution permissions for the Tailwind binary
    - name: Fix Tailwind Permissions
      run: chmod +x ./node_modules/.bin/tailwindcss

    # 4. Generate your fresh production app.css directly into your assets folder
    - name: Build Tailwind CSS
      run: ./node_modules/.bin/tailwindcss -i ./assets/css/app.css --minify

    # 5. Sync the production files to InfinityFree
    - name: Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: htdocs/
        exclude: |
          .git*
          .github/**
          node_modules/**
          package*.json
          tailwind.config.js
